# =============================================================================
# COMEXT Pipeline — Project Configuration
#
# Build backend: setuptools (standard, widely compatible)
# Package manager: uv  (see [tool.uv] section below)
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project metadata & runtime dependencies
# -----------------------------------------------------------------------------
[project]
name = "comext_pipeline"
version = "0.1.0"
description = "Dagster pipeline for Eurostat COMEXT international trade data"
requires-python = ">=3.11"
dependencies = [
    # Dagster orchestration
    "dagster>=1.7.0",
    "dagster-webserver>=1.7.0",

    # Data processing & storage
    "duckdb>=0.10.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",

    # HTTP client & archive extraction
    "httpx>=0.27.0",
    "py7zr>=0.21.0",

    # Validation & settings
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # Utilities
    "python-dateutil>=2.9.0",
    "structlog>=24.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

# -----------------------------------------------------------------------------
# CLI entry points
# -----------------------------------------------------------------------------
[project.scripts]
comext-backfill = "scripts.backfill:main"

# -----------------------------------------------------------------------------
# Package discovery
# -----------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["comext_pipeline*", "scripts*"]

# -----------------------------------------------------------------------------
# uv — package manager configuration
# https://docs.astral.sh/uv/reference/settings/
#
# Dev dependencies are declared here (uv-native) rather than in
# [project.optional-dependencies] to avoid duplication.
# To add a dev dep: uv add --dev <package>
# To update lockfile: make lock          (respects pinned versions)
#                     make lock-upgrade  (upgrades to latest compatible)
# -----------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-python-dateutil",
    "dagster-webserver",
]

# -----------------------------------------------------------------------------
# Ruff — linter & formatter
# https://docs.astral.sh/ruff/
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = ["E501"]  # line-too-long — handled by formatter, not linter

# -----------------------------------------------------------------------------
# Mypy — static type checker
# https://mypy.readthedocs.io/
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disable_error_code = ["type-arg"]

# -----------------------------------------------------------------------------
# Pytest — test runner
# https://docs.pytest.org/
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"  # show all non-passed results, quiet output